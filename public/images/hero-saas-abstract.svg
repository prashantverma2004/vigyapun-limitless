<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090C"/>
      <stop offset="0.6" stop-color="#0E0D0C"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="sky" cx="960" cy="780" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B37A" stop-opacity="0.30"/>
      <stop offset="0.35" stop-color="#8A6C45" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="1700" cy="80" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E4A5E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="960" cy="760" r="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1612"/>
      <stop offset="0.25" stop-color="#0D0C0B"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D39A" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#F3D39A" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#F7E2B8" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#F3D39A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F3D39A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.1" fill="#C8B8A0"/>
    </pattern>
    <radialGradient id="dotFade" cx="960" cy="420" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="1920" height="1080" fill="url(#dotFade)"/>
    </mask>
  </defs>

  <!-- Base and atmosphere -->
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#cool)"/>
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Dot grid -->
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- Orbit arcs above the horizon -->
  <g fill="none" stroke="#C8B8A0">
    <circle cx="960" cy="1960" r="1330" stroke-opacity="0.07"/>
    <circle cx="960" cy="1960" r="1480" stroke-opacity="0.05" stroke-dasharray="2 12"/>
    <circle cx="960" cy="1960" r="1650" stroke-opacity="0.04"/>
  </g>

  <!-- Data network nodes (kept to the sides, clear of the text) -->
  <g stroke="#C8B8A0" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M180 260 L360 190 L520 300 L430 430 L250 400 Z M360 190 L430 430"/>
    <path d="M1420 220 L1600 150 L1760 280 L1650 410 L1480 360 Z M1600 150 L1650 410"/>
  </g>
  <g fill="#E8E0D8">
    <circle cx="180" cy="260" r="2.5" fill-opacity="0.5"/>
    <circle cx="360" cy="190" r="3" fill-opacity="0.7"/>
    <circle cx="520" cy="300" r="2.5" fill-opacity="0.5"/>
    <circle cx="430" cy="430" r="3.5" fill-opacity="0.8"/>
    <circle cx="250" cy="400" r="2" fill-opacity="0.4"/>
    <circle cx="1420" cy="220" r="2" fill-opacity="0.4"/>
    <circle cx="1600" cy="150" r="3" fill-opacity="0.7"/>
    <circle cx="1760" cy="280" r="2.5" fill-opacity="0.5"/>
    <circle cx="1650" cy="410" r="3.5" fill-opacity="0.8"/>
    <circle cx="1480" cy="360" r="2.5" fill-opacity="0.5"/>
  </g>
  <circle cx="430" cy="430" r="12" fill="none" stroke="#E8E0D8" stroke-opacity="0.15"/>
  <circle cx="1650" cy="410" r="12" fill="none" stroke="#E8E0D8" stroke-opacity="0.15"/>

  <!-- Horizon: planet body with glowing rim -->
  <circle cx="960" cy="1960" r="1200" fill="url(#planet)"/>
  <circle cx="960" cy="1960" r="1200" fill="none" stroke="url(#rim)" stroke-width="10" filter="url(#glow)"/>
  <circle cx="960" cy="1960" r="1200" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
